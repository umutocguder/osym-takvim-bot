<!-- Created by 11Hopem -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#31104b" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="92" fill="none" stroke="url(#primaryGrad)" stroke-width="3" stroke-opacity="0.3" />

  <!-- Calendar Container -->
  <g transform="translate(96, 96)">
    <!-- Calendar Body -->
    <rect x="0" y="32" width="320" height="272" rx="36" fill="#1e293b" stroke="#334155" stroke-width="4" filter="url(#glow)" />
    
    <!-- Calendar Header -->
    <path d="M 0 68 C 0 48, 16 32, 36 32 L 284 32 C 304 32, 320 48, 320 68 L 320 100 L 0 100 Z" fill="url(#primaryGrad)" />
    
    <!-- Calendar Rings -->
    <rect x="64" y="12" width="20" height="44" rx="10" fill="#f8fafc" />
    <rect x="236" y="12" width="20" height="44" rx="10" fill="#f8fafc" />

    <!-- Calendar Grid Dots / Days -->
    <circle cx="64" cy="148" r="14" fill="#475569" />
    <circle cx="128" cy="148" r="14" fill="#475569" />
    <circle cx="192" cy="148" r="14" fill="#475569" />
    <circle cx="256" cy="148" r="14" fill="url(#accentGrad)" />

    <circle cx="64" cy="208" r="14" fill="#475569" />
    <circle cx="128" cy="208" r="14" fill="url(#primaryGrad)" />
    <circle cx="192" cy="208" r="14" fill="#475569" />
    <circle cx="256" cy="208" r="14" fill="#475569" />

    <circle cx="64" cy="264" r="14" fill="#475569" />
    <circle cx="128" cy="264" r="14" fill="#475569" />
    <circle cx="192" cy="264" r="14" fill="url(#accentGrad)" />
    <circle cx="256" cy="264" r="14" fill="#475569" />

    <!-- Academic Cap / Exam Badge Floating -->
    <g transform="translate(190, 180)">
      <circle cx="60" cy="60" r="54" fill="#0f172a" stroke="url(#accentGrad)" stroke-width="4" />
      <!-- Graduation Cap Icon -->
      <path d="M 30 55 L 60 40 L 90 55 L 60 70 Z" fill="url(#primaryGrad)" />
      <path d="M 44 65 L 44 80 C 44 86, 76 86, 76 80 L 76 65" fill="none" stroke="url(#accentGrad)" stroke-width="3" stroke-linecap="round" />
      <path d="M 86 57 L 94 72 L 91 85" fill="none" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round" />
    </g>
  </g>

  <!-- 11Hopem Signature Badge -->
  <text x="256" y="445" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" letter-spacing="4" fill="#94a3b8" text-anchor="middle">ÖSYM TAKVİM BOT</text>
  <text x="256" y="475" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" letter-spacing="2" fill="#64748b" text-anchor="middle">BY 11HOPEM</text>
</svg>
